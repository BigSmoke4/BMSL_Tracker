# ---------------------------------------------------------------------------
# BMSL Tracker — local production-like stack
#
#   docker compose up --build
#
# App:   http://localhost:8080  (health: /health, readiness: /health/ready)
# SQL:   sqlserver:1433 (only reachable inside the compose network)
#
# Credentials here are DEV ONLY. Override via .env file or environment
# (see docs/DEPLOYMENT.md). Provide Google OAuth via:
#   Authentication__Google__ClientId / Authentication__Google__ClientSecret
# ---------------------------------------------------------------------------

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bmsl-tracker:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # HTTP-only local run behind no TLS terminator: disable forced redirect.
      Security__RequireHttps: "false"
      ForwardedHeaders__Enabled: "true"
      ConnectionStrings__DefaultConnection: "Server=db;Database=BMSL_Tracker;User Id=sa;Password=${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env};TrustServerCertificate=True;Encrypt=True"
      Database__Provider: SqlServer
      Database__ApplyMigrations: "true"
      DataProtection__KeyRingPath: /keys
    env_file:
      - path: .env
        required: false
    volumes:
      - keys:/keys
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mssql-data:
  keys:

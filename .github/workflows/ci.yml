name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore BMSL_Tracker/BMSL_Tracker.csproj

      - name: Build Release
        run: dotnet build BMSL_Tracker/BMSL_Tracker.csproj --configuration Release --no-restore
